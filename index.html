<style>

html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#eef2f7;color:#0f172a}
.app{display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px;max-width:1680px;margin:0 auto}
.panel,.preview-wrap{background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.08)}

.preview-wrap{padding:18px;overflow:auto;max-height:calc(100vh - 28px)}

button.secondary{background:#e2e8f0;color:#0f172a}
button.danger{background:#fee2e2;color:#991b1b}

label{display:block;font-size:13px;font-weight:900;color:#334155;margin-top:10px}
input,textarea,select{width:100%;border:1px solid #dbe3ef;border-radius:10px;padding:9px 10px;font-size:14px;outline:none;background:#fff;margin-top:5px}
.usage{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;font-size:13px;line-height:1.7;margin-top:12px}

.status.show{display:block}
.paper{width:794px;background:#fff;margin:0 auto;color:#111}
.template-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 22px 0;border:2px solid #111;background:#fff}
.template-table td,.template-table th{border:1.4px solid #111;padding:6px;vertical-align:middle;font-size:13px;line-height:1.75;word-break:break-word;white-space:pre-line}
.template-table td[contenteditable="true"]{outline:none}
.template-table td[contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px #2563eb;background:#eff6ff}

.cat-col{width:78px;text-align:center;font-weight:900}
.content-col{width:220px}
.photo-col{width:175px;text-align:center}
.result-col{width:70px;text-align:center;font-weight:900}
.remark-col{width:74px;text-align:center}
.title-cell{font-size:24px!important;font-weight:900;text-align:center;line-height:1.5!important}
.station-cell{font-size:17px!important;font-weight:900;text-align:left}
.meta-left-cell{font-size:15px!important;font-weight:900;text-align:left}
.meta-right-cell{font-size:15px!important;font-weight:900;text-align:right}
.header-cell{font-weight:900;text-align:center}
.photo-box{min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;justify-items:center;align-items:start}
.photo-box img{max-width:72px;max-height:82px;object-fit:contain;display:block;margin:2px auto}
.photo-tools{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.photo-tools button{font-size:11px;padding:4px 6px;border-radius:7px}
.add-photo{background:#e2e8f0;color:#0f172a;font-size:12px;padding:7px 9px}
.result-select{border:0;background:transparent;text-align:center;text-align-last:center;font-weight:900;width:100%;outline:none}
.remark-col:empty::before{content:"点击填写备注";color:#94a3b8;font-size:12px}
.file-input{display:none}
.export-root{position:fixed;left:-100000px;top:0;width:794px;background:#fff;color:#111;z-index:-1}
.export-root .paper{width:794px!important;margin:0!important;transform:none!important;background:#fff!important}
.export-root button,.export-root input[type=file]{display:none!important}
.export-root select{display:none!important}
.export-result-text{display:inline-block;width:100%;text-align:center;font-weight:900}
@media (max-width: 768px){
  body{overflow-x:hidden}
  .app{display:block;width:100%;padding:8px}
  .panel{max-height:none;overflow:visible;margin-bottom:10px;padding:12px}
  .preview-wrap{max-height:none;overflow:visible;padding:8px}
  #paperScaleBox{width:100%;overflow:visible}
  .paper{transform-origin:top left}
}
@media print{
  body{background:#fff}
  .panel{display:none!important}
  .app{display:block;padding:0;margin:0;max-width:none}
  .preview-wrap{box-shadow:none;border-radius:0;padding:0;overflow:visible;max-height:none}
  .paper{width:100%;margin:0;transform:none!important}
  button,input[type=file],select{display:none!important}

<div class="app">
  <aside class="panel">
    <h1>质保验收报告</h1>
    <div class="hint">全新稳定版：右侧预览打开即显示；Word 导出为真实 .docx；PDF 点击后直接生成 .pdf 文件。</div>
    <div class="btns">
      <button id="exportWordBtn" type="button" onclick="exportWordEditable()">导出 Word</button>
      <button id="exportPdfBtn" type="button" class="green" onclick="exportPDF()">导出 PDF</button>

      <button id="loadBtn" type="button" class="secondary" onclick="document.getElementById('loadFile').click()">读取数据</button>
      <input id="loadFile" class="file-input" type="file" accept=".json,application/json">
    </div>
    <div id="status" class="status"></div>

    <label>报告标题</label>

    <label>场站名称</label>
    <input id="stationName" value="理想超充站 杭州浙大网新">

    <label>验收人员</label>
    <input id="inspector" value="">

    <label>验收日期</label>
    <input id="acceptDate" type="date" value="2026-05-16">

    <div class="usage">
      <b>使用说明：</b><br>
      1. 表格内容可在右侧直接点击编辑。<br>
      2. 记录方式列点击“添加照片”。<br>
      3. 检查结果可选：合格 / 不合格 / 不涉及。<br>
      4. 导出 PDF 为直出文件，不需要手动打印。<br>
      5. Word 为真实 .docx，适合 WPS / Office 打开。
    </div>
  </aside>

  <main class="preview-wrap">
    <div id="paperScaleBox">
      <div id="paper" class="paper"></div>
    </div>
  </main>
</div>

function setStatus(msg, show=true){
  const el=document.getElementById("status");
  if(!el)return;
  el.innerHTML=msg||"";
  el.classList.toggle("show",!!show);
}
function val(id){return document.getElementById(id)?.value||""}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,"<br>")}
function sanitizeFileName(name){return String(name||"质保验收报告").replace(/[\\/:*?"<>|]/g,"_").replace(/\s+/g," ").trim()||"质保验收报告"}
function getExportBaseName(){return sanitizeFileName(val("stationName")||val("reportTitle")||"质保验收报告")}

function syncHeader(){
  if(!tables[0]) return;
  tables[0].rows[0]=[{id:"title",text:val("reportTitle"),col:0,colspan:6,rowspan:1,classes:"title-cell",photos:[],isPhoto:false}];
  tables[0].rows[1]=[{id:"station",text:"场站名称：  "+val("stationName"),col:0,colspan:6,rowspan:1,classes:"station-cell",photos:[],isPhoto:false}];
  tables[0].rows[2]=[
    {id:"inspectorCell",text:"验收人员：  "+val("inspector"),col:0,colspan:3,rowspan:1,classes:"meta-left-cell",photos:[],isPhoto:false},
    {id:"dateCell",text:"验收日期：  "+val("acceptDate"),col:3,colspan:3,rowspan:1,classes:"meta-right-cell",photos:[],isPhoto:false}
  ];
}
function cellClass(ti,ri,cell){
  let cls=cell.classes||"";
  if(ti===0&&ri===3) cls+=" header-cell";
  if((cls.includes("remark-col")||cell.col===5)&&!(ti===0&&ri===3)) cls+=" remark-col";
  return cls;
}
function isResultCell(ti,ri,cell){return (cell.classes||"").includes("result-col")&&!(ti===0&&ri===3)}
function renderResult(cell){
  const v=cell.text||"合格";
  cell.text=v;
  return '<select class="result-select" data-result-cell="'+cell.id+'">'+
    '<option '+(v==="合格"?"selected":"")+'>合格</option>'+
    '<option '+(v==="不合格"?"selected":"")+'>不合格</option>'+
    '<option '+(v==="不涉及"?"selected":"")+'>不涉及</option>'+
  '</select>';
}


function renderPhoto(cell){
  const photos=cell.photos||[];
  let html='<div class="photo-box">';
  if(photos.length){
    html+='<div class="photo-grid">';
    photos.slice(0,2).forEach((p,i)=>{
      html+='<div><img src="'+p.src+'"><div class="photo-tools"><button type="button" data-del-photo="'+cell.id+'" data-index="'+i+'">删除</button></div></div>';
    });
    html+='</div>';
    if(photos.length>2){
      html+='<div class="photo-more-tip">另有 '+(photos.length-2)+' 张照片<br>已保存，不在表格内继续显示</div>';
    }
  }
  html+='<button type="button" class="add-photo" data-add-photo="'+cell.id+'">添加照片</button>';
  html+='</div>';
  return html;
}



function adjustPhotoRowHeights(){
  try{
    const paper=document.getElementById("paper");
    if(!paper) return;
    paper.querySelectorAll("td.photo-col").forEach(td=>{
      const imgs=td.querySelectorAll(".photo-grid img").length;
      const tr=td.closest("tr");
      if(!tr) return;
      if(imgs>0){
        const minH = Math.max(150, imgs*176 + 34);
        tr.style.height = minH + "px";
        tr.style.minHeight = minH + "px";
        td.style.height = minH + "px";
        td.style.minHeight = minH + "px";
      }
    });
  }catch(e){console.warn("adjustPhotoRowHeights failed",e);}
}


function limitPhotoDisplay(){
  try{
    const paper=document.getElementById("paper");
    if(!paper) return;
    paper.querySelectorAll(".photo-box").forEach(box=>{
      const imgs=[...box.querySelectorAll(".photo-grid > div")];
      const existing=box.querySelector(".photo-more-tip");
      if(imgs.length>2){
        imgs.slice(2).forEach(x=>x.style.display="none");
        if(!existing){
          const tip=document.createElement("div");
          tip.className="photo-more-tip";
          tip.innerHTML="另有 "+(imgs.length-2)+" 张照片<br>已保存，不在表格内继续显示";
          const grid=box.querySelector(".photo-grid");
          if(grid) grid.after(tip);
        }
      }
    });
  }catch(e){console.warn("limitPhotoDisplay failed",e);}
}


function openPhotoPicker(cellId){
  const input=document.createElement("input");
  input.type="file";
  input.accept="image/*";
  input.multiple=true;
  input.style.position="fixed";
  input.style.left="-9999px";
  input.style.top="-9999px";
  document.body.appendChild(input);
  input.addEventListener("change", async ()=>{
    const cell=findCell(cellId);
    if(!cell){input.remove();return;}
    if(!cell.photos) cell.photos=[];
    const files=[...input.files];
    if(!files.length){input.remove();return;}
    setStatus("正在上传照片 0/"+files.length+"...");
    for(let i=0;i<files.length;i++){
      try{
        const src=await readImageFile(files[i]);
        cell.photos.push({src});
        setStatus("正在上传照片 "+(i+1)+"/"+files.length+"...");
      }catch(e){
        console.error(e);
      }
    }
    input.remove();
    render();
    setStatus("照片上传完成",true);
    setTimeout(()=>setStatus("",false),1200);
  });
  input.click();
}

function render(){
  syncHeader();
  const paper=document.getElementById("paper");
  let out="";
  for(let ti=0;ti<tables.length;ti++){
    const tbl=tables[ti];
    out+='<table class="template-table" data-table="'+ti+'"><tbody>';
    for(let ri=0;ri<tbl.rows.length;ri++){
      const row=tbl.rows[ri].slice().sort((a,b)=>(a.col||0)-(b.col||0));
      out+="<tr>";
      row.forEach(cell=>{
        const attrs=(cell.colspan>1?' colspan="'+cell.colspan+'"':'')+(cell.rowspan>1?' rowspan="'+cell.rowspan+'"':'');
        const cls=cellClass(ti,ri,cell);
        const editable=(cell.isPhoto||isResultCell(ti,ri,cell)||(ti===0&&ri<=2))?'':' contenteditable="true"';
        let content="";
        if(cell.isPhoto) content=renderPhoto(cell);
        else if(isResultCell(ti,ri,cell)) content=renderResult(cell);
        else content=nl2br(cell.text);
        out+='<td class="'+cls+'" data-cell="'+cell.id+'"'+attrs+editable+'>'+content+'</td>';
      });
      out+="</tr>";
    }
    out+="</tbody></table>";
  }
  paper.innerHTML=out;
  setTimeout(fitMobile,80);
  setTimeout(adjustPhotoRowHeights,0);
  setTimeout(limitPhotoDisplay,0);
}
function fitMobile(){
  const paper=document.getElementById("paper");
  const box=document.getElementById("paperScaleBox");
  if(!paper||!box)return;
  if(window.innerWidth<=768){
    const scale=Math.min(1,(box.clientWidth||window.innerWidth)/794);
    paper.style.transform='scale('+scale+')';
    paper.style.width='794px';
    paper.style.minWidth='794px';
    box.style.height=Math.ceil(paper.scrollHeight*scale+20)+'px';
  }else{
    paper.style.transform='';
    paper.style.width='';
    paper.style.minWidth='';
    box.style.height='';
  }
}
function findCell(id){
  for(const tbl of tables) for(const row of tbl.rows) for(const cell of row) if(cell.id===id) return cell;
  return null;
}

async function readImageFile(file){
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>resolve(e.target.result);r.onerror=reject;r.readAsDataURL(file);});
  return await compressDataUrl(raw,1280,0.78);
}
function loadImg(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;})}
async function compressDataUrl(dataUrl,maxSide=1280,quality=0.78){
  try{
    const img=await loadImg(dataUrl);
    const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*scale));
    const h=Math.max(1,Math.round(img.height*scale));
    const c=document.createElement("canvas");
    c.width=w;c.height=h;
    const ctx=c.getContext("2d",{alpha:false});
    ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    return c.toDataURL("image/jpeg",quality);
  }catch(e){return dataUrl}
}

document.getElementById("paper").addEventListener("input",e=>{
  const td=e.target.closest("td[data-cell]");
  if(!td||td.querySelector(".photo-box")||td.querySelector("select"))return;
  const cell=findCell(td.dataset.cell);
  if(cell) cell.text=td.innerText;
});
document.getElementById("paper").addEventListener("change",e=>{
  const sel=e.target.closest("select[data-result-cell]");
  if(sel){const cell=findCell(sel.dataset.resultCell);if(cell){cell.text=sel.value;render();}}
  const input=e.target.closest("input[data-file-input]");
  if(input){
    const cell=findCell(input.dataset.fileInput);
    if(!cell)return;
    const files=[...input.files].filter(f=>f.type.startsWith("image/"));
    (async()=>{
      cell.photos=cell.photos||[];
      for(let i=0;i<files.length;i++){setStatus("正在压缩上传照片 "+(i+1)+"/"+files.length+"...");cell.photos.push({src:await readImageFile(files[i])});}
      input.value="";
      render();
      setStatus("照片上传完成",true);
      setTimeout(()=>setStatus("",false),1200);
    })();
  }
});
document.getElementById("paper").addEventListener("click",e=>{
  const add=e.target.closest("[data-add-photo]");
  if(add){const inp=document.querySelector('input[data-file-input="'+add.dataset.addPhoto+'"]');if(inp)inp.click();}
  const del=e.target.closest("[data-del-photo]");
  if(del){const cell=findCell(del.dataset.delPhoto);if(cell&&cell.photos){if(confirm("确定删除这张照片吗？")){cell.photos.splice(Number(del.dataset.index),1);render();}}}
});

["reportTitle","stationName","inspector","acceptDate"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("input",render);
  el.addEventListener("change",render);
});

function cloneForExport(){
  render();
  const source=document.getElementById("paper");
  const root=document.createElement("div");
  root.className="export-root";
  const clone=source.cloneNode(true);
  root.appendChild(clone);
  document.body.appendChild(root);
  clone.querySelectorAll("button,input[type=file]").forEach(el=>el.remove());
  clone.querySelectorAll("select").forEach(sel=>{const span=document.createElement("span");span.className="export-result-text";span.textContent=sel.value||"合格";sel.replaceWith(span);});
  clone.querySelectorAll("img").forEach(img=>{img.style.maxWidth="80px";img.style.maxHeight="90px";img.style.objectFit="contain";});
  
  root.querySelectorAll("td.photo-col").forEach(td=>{
    const imgs=td.querySelectorAll(".photo-grid img").length;
    const tr=td.closest("tr");
    if(tr && imgs>0){
      const minH=Math.max(150, imgs*176 + 24);
      tr.style.height=minH+"px";
      tr.style.minHeight=minH+"px";
      td.style.height=minH+"px";
      td.style.minHeight=minH+"px";
    }
  });

  
  root.querySelectorAll(".photo-box").forEach(box=>{
    const items=[...box.querySelectorAll(".photo-grid > div")];
    if(items.length>2){
      items.slice(2).forEach(x=>x.remove());
      const tip=document.createElement("div");
      tip.className="photo-more-tip";
      tip.textContent="另有 "+(items.length-2)+" 张照片";
      box.appendChild(tip);
    }
  });

  return root;
}
function cleanup(root){if(root&&root.parentNode)root.parentNode.removeChild(root)}

async function exportPDF(){
  try{
    if(typeof html2canvas==="undefined"||!window.jspdf){alert("PDF组件加载失败，请刷新页面后再试");return;}
    setStatus("正在生成 PDF，请稍等...");
    const root=cloneForExport();
    const tables=[...root.querySelectorAll("table")];
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF("p","mm","a4");
    const pageW=210,pageH=297,margin=8,imgW=pageW-margin*2;
    let first=true;
    for(let i=0;i<tables.length;i++){
      setStatus("正在生成 PDF "+(i+1)+"/"+tables.length+"...");
      const canvas=await canvasForTable(tables[i],1.05);
      const imgH=imgW*canvas.height/canvas.width;
      if(!first)pdf.addPage();first=false;
      pdf.addImage(canvas.toDataURL("image/jpeg",0.82),"JPEG",margin,margin,imgW,Math.min(imgH,pageH-margin*2));
      canvas.width=1;canvas.height=1;
    }
    pdf.save(getExportBaseName()+".pdf");
    cleanup(root);
    setStatus("PDF 已生成",true);setTimeout(()=>setStatus("",false),1500);
  }catch(e){console.error(e);alert("PDF生成失败，请减少照片数量或用电脑浏览器导出");setStatus("",false);}
}

async function exportWord(){
  try{
    if(typeof JSZip==="undefined"||typeof html2canvas==="undefined"){alert("Word组件加载失败，请刷新页面后再试");return;}
    setStatus("正在生成 Word，请稍等...");
    const root=cloneForExport();
    const tables=[...root.querySelectorAll("table")];
    const zip=new JSZip();const word=zip.folder("word");const media=word.folder("media");
    const rels=[];let bodyXml="";
    for(let i=0;i<tables.length;i++){
      setStatus("正在生成 Word "+(i+1)+"/"+tables.length+"...");
      const canvas=await canvasForTable(tables[i],1.05);
      const fileName="report_"+(i+1)+".jpg";const rId="rId"+(i+1);
      media.file(fileName,canvas.toDataURL("image/jpeg",0.82).split(",")[1],{base64:true});
      rels.push({rId:rId,fileName:fileName});
      const targetW=602,targetH=Math.round(targetW*canvas.height/canvas.width);
      bodyXml+=imageParagraph(rId,targetW,targetH)+"<w:p/>";
      canvas.width=1;canvas.height=1;
    }
    const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>'+bodyXml+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="360" w:footer="360" w:gutter="0"/></w:sectPr></w:body></w:document>';
    const rootRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdOfficeDoc" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
    const docRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.map(r=>'<Relationship Id="'+r.rId+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+r.fileName+'"/>').join("")+'</Relationships>';
    const contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
    zip.file("[Content_Types].xml",contentTypes);zip.folder("_rels").file(".rels",rootRels);word.file("document.xml",documentXml);word.folder("_rels").file("document.xml.rels",docRels);
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=getExportBaseName()+".docx";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    cleanup(root);
    setStatus("Word 已生成",true);setTimeout(()=>setStatus("",false),1500);
  }catch(e){console.error(e);alert("Word生成失败，请减少照片数量或用电脑浏览器导出");setStatus("",false);}
}


/* ===== 安全可编辑Word导出：不影响页面渲染 ===== */
function xmlSafe(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;"}[m]));}
function docxP(text,bold=false,align="left",size=22){
  return '<w:p><w:pPr><w:jc w:val="'+align+'"/></w:pPr><w:r><w:rPr>'+(bold?'<w:b/>':'')+'<w:sz w:val="'+size+'"/></w:rPr><w:t xml:space="preserve">'+xmlSafe(text)+'</w:t></w:r></w:p>';
}
function docxTc(inner,colspan=1,width=1200){
  const gs=colspan>1?'<w:gridSpan w:val="'+colspan+'"/>':'';
  return '<w:tc><w:tcPr><w:tcW w:w="'+width+'" w:type="dxa"/>'+gs+'<w:vAlign w:val="center"/></w:tcPr>'+inner+'</w:tc>';
}
function dataUrlInfoDocx(dataUrl){
  const m=String(dataUrl||"").match(/^data:(image\/(png|jpeg|jpg|webp));base64,(.*)$/i);
  if(!m)return null;
  let ext=(m[2]||"jpg").toLowerCase(); if(ext==="jpeg")ext="jpg";
  return {ext,base64:m[3]};
}
function docxImg(rId,w=120,h=150){
  const cx=Math.round(w*9525),cy=Math.round(h*9525);
  return '<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:docPr id="'+Math.floor(Math.random()*100000)+'" name="photo"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="photo"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="'+rId+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}
async function exportWordEditable(){
  if(typeof JSZip==="undefined"){alert("Word组件加载失败，请刷新页面后重试");return;}
  try{
    syncHeader();
    setStatus("正在生成可编辑Word...");
    const zip=new JSZip(), word=zip.folder("word"), media=word.folder("media");
    const rels=[]; let body='';
    const colW=[650,1150,1900,1600,1050,950];
    for(let ti=0;ti<tables.length;ti++){
      const tbl=tables[ti];
      body+='<w:tbl><w:tblPr><w:tblBorders><w:top w:val="single" w:sz="10" w:color="000000"/><w:left w:val="single" w:sz="10" w:color="000000"/><w:bottom w:val="single" w:sz="10" w:color="000000"/><w:right w:val="single" w:sz="10" w:color="000000"/><w:insideH w:val="single" w:sz="8" w:color="000000"/><w:insideV w:val="single" w:sz="8" w:color="000000"/></w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>'+colW.map(w=>'<w:gridCol w:w="'+w+'"/>').join("")+'</w:tblGrid>';
      for(let ri=0;ri<tbl.rows.length;ri++){
        const row=tbl.rows[ri];
        body+='<w:tr>';
        for(const cell of row){
          const cls=cell.classes||"";
          const colspan=cell.colspan||1;
          const width=colW.slice(cell.col||0,(cell.col||0)+colspan).reduce((a,b)=>a+b,0)||1200;
          let inner='';
          if(cell.isPhoto){
            const photos=(cell.photos||[]).slice(0,2);
            if(!photos.length){inner=docxP("添加照片",false,"center",20);}
            for(let pi=0;pi<photos.length;pi++){
              const info=dataUrlInfoDocx(photos[pi].src); if(!info)continue;
              const rId='rIdImg_'+ti+'_'+ri+'_'+pi+'_'+Math.floor(Math.random()*9999);
              const fn='img_'+ti+'_'+ri+'_'+pi+'.'+info.ext;
              media.file(fn,info.base64,{base64:true});
              rels.push({rId,fileName:fn});
              inner+=docxImg(rId,120,150);
            }
          }else{
            const align=(cls.includes("title-cell")||cls.includes("header-cell")||cls.includes("no-col")||cls.includes("cat-col")||cls.includes("result-col")||cls.includes("remark-col"))?"center":"left";
            const bold=cls.includes("title-cell")||cls.includes("header-cell")||cls.includes("cat-col")||cls.includes("result-col");
            const size=cls.includes("title-cell")?28:22;
            inner=String(cell.text||"").split(/\n/).map(t=>docxP(t,bold,align,size)).join("");
          }
          body+=docxTc(inner,colspan,width);
        }
        body+='</w:tr>';
      }
      body+='</w:tbl><w:p/>';
    }
    const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="360" w:footer="360" w:gutter="0"/></w:sectPr></w:body></w:document>';
    const rootRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdOfficeDoc" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
    const docRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.map(r=>'<Relationship Id="'+r.rId+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+r.fileName+'"/>').join("")+'</Relationships>';
    const contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Default Extension="webp" ContentType="image/webp"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
    zip.file("[Content_Types].xml",contentTypes); zip.folder("_rels").file(".rels",rootRels); word.file("document.xml",documentXml); word.folder("_rels").file("document.xml.rels",docRels);
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
    const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=getExportBaseName()+"_可编辑版.docx"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    setStatus("可编辑Word已生成",true); setTimeout(()=>setStatus("",false),1600);
  }catch(e){console.error(e);alert("可编辑Word生成失败，请减少照片数量或用电脑浏览器导出");setStatus("",false);}
}

function saveData(){
  const data={fields:{reportTitle:val("reportTitle"),stationName:val("stationName"),inspector:val("inspector"),acceptDate:val("acceptDate")},tables:tables};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=getExportBaseName()+"_草稿.json";a.click();URL.revokeObjectURL(url);
}
function loadDataFile(file){
  const reader=new FileReader();
  reader.onload=e=>{try{const data=JSON.parse(e.target.result);if(data.fields)Object.entries(data.fields).forEach(([k,v])=>{if(document.getElementById(k))document.getElementById(k).value=v});if(data.tables)tables=data.tables;render();}catch(err){alert("读取失败，请选择正确的JSON文件")}};
  reader.readAsText(file);
}
document.getElementById("loadFile").addEventListener("change",e=>{if(e.target.files[0])loadDataFile(e.target.files[0]);e.target.value=""});
window.addEventListener("resize",()=>setTimeout(fitMobile,80));
window.addEventListener("DOMContentLoaded",render);
window.addEventListener("load",()=>setTimeout(render,100));
