<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>质保验收报告</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#eef2f7;color:#0f172a}
.app{display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px;max-width:1680px;margin:0 auto}
.panel,.preview-wrap{background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.08)}
.panel{padding:16px;max-height:calc(100vh - 28px);overflow:auto}
.preview-wrap{padding:18px;overflow:auto;max-height:calc(100vh - 28px)}
h1{font-size:24px;margin:0 0 10px;font-weight:900}
.hint{font-size:13px;line-height:1.65;color:#64748b;margin-bottom:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{border:0;border-radius:10px;padding:9px 12px;background:#0f172a;color:#fff;font-weight:900;cursor:pointer;font-size:14px}
button.green{background:#16a34a}
button.secondary{background:#e2e8f0;color:#0f172a}
button.danger{background:#fee2e2;color:#991b1b}
button:hover{filter:brightness(.96)}
label{display:block;font-size:13px;font-weight:900;color:#334155;margin-top:10px}
input,textarea,select{width:100%;border:1px solid #dbe3ef;border-radius:10px;padding:9px 10px;font-size:14px;outline:none;background:#fff;margin-top:5px}
.usage{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;font-size:13px;line-height:1.7;margin-top:12px}
.status{display:none;margin:10px 0;padding:10px 12px;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-size:13px;font-weight:800;line-height:1.5}
.status.show{display:block}
.paper{width:794px;background:#fff;margin:0 auto;color:#111}
.template-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 22px 0;border:2px solid #111;background:#fff}
.template-table td,.template-table th{border:1.4px solid #111;padding:6px;vertical-align:middle;font-size:13px;line-height:1.75;word-break:break-word;white-space:pre-line}
.template-table td[contenteditable="true"]{outline:none}
.template-table td[contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px #2563eb;background:#eff6ff}
.no-col{width:34px;text-align:center}
.cat-col{width:78px;text-align:center;font-weight:900}
.content-col{width:220px}
.photo-col{width:175px;text-align:center}
.result-col{width:70px;text-align:center;font-weight:900}
.remark-col{width:74px;text-align:center}
.title-cell{font-size:24px!important;font-weight:900;text-align:center;line-height:1.5!important}
.station-cell{font-size:17px!important;font-weight:900;text-align:left}
.meta-left-cell{font-size:15px!important;font-weight:900;text-align:left}
.meta-right-cell{font-size:15px!important;font-weight:900;text-align:right}
.header-cell{font-weight:900;text-align:center}
.photo-box{min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.photo-grid{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:flex-start;width:100%;max-width:100%;overflow:hidden}
.photo-box img{width:145px;height:185px;max-width:145px;max-height:185px;object-fit:contain;display:block;margin:0 auto;border:1px solid #e5e7eb;background:#fff}
.photo-tools{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.photo-tools button{font-size:11px;padding:4px 6px;border-radius:7px}
.add-photo{background:#e2e8f0;color:#0f172a;font-size:12px;padding:7px 9px}
.result-select{border:0;background:transparent;text-align:center;text-align-last:center;font-weight:900;width:100%;outline:none}
.remark-col:empty::before{content:"点击填写备注";color:#94a3b8;font-size:12px}
.file-input{display:none}
.export-root{position:fixed;left:-100000px;top:0;width:794px;background:#fff;color:#111;z-index:-1}
.export-root .paper{width:794px!important;margin:0!important;transform:none!important;background:#fff!important}
.export-root button,.export-root input[type=file]{display:none!important}
.export-root select{display:none!important}
.export-result-text{display:inline-block;width:100%;text-align:center;font-weight:900}
@media (max-width: 768px){
  body{overflow-x:hidden}
  .app{display:block;width:100%;padding:8px}
  .panel{max-height:none;overflow:visible;margin-bottom:10px;padding:12px}
  .preview-wrap{max-height:none;overflow:visible;padding:8px}
  #paperScaleBox{width:100%;overflow:visible}
  .paper{transform-origin:top left}
}
@media print{
  body{background:#fff}
  .panel{display:none!important}
  .app{display:block;padding:0;margin:0;max-width:none}
  .preview-wrap{box-shadow:none;border-radius:0;padding:0;overflow:visible;max-height:none}
  .paper{width:100%;margin:0;transform:none!important}
  button,input[type=file],select{display:none!important}
}

/* ===== 真DOCX + 真PDF直出版：不导出HTML，不导出假doc ===== */
.photo-col{overflow:hidden!important;vertical-align:middle!important}
.photo-box{width:100%!important;max-width:100%!important;overflow:hidden!important;text-align:center!important;padding:4px!important}
.photo-grid{display:flex!important;flex-direction:column!important;gap:8px!important;align-items:center!important;width:100%!important;max-width:100%!important;overflow:hidden!important}
.photo-grid>div{width:100%!important;overflow:hidden!important;text-align:center!important}
.photo-box img{width:auto!important;max-width:150px!important;height:auto!important;max-height:190px!important;object-fit:contain!important;display:block!important;margin:2px auto!important;border:1px solid #e5e7eb!important;background:#fff!important}
.photo-tools{display:flex!important;justify-content:center!important;gap:6px!important;margin:3px 0 6px!important}
.photo-tools button,button[data-del-photo]{display:inline-block!important;background:#fee2e2!important;color:#991b1b!important;border:0!important;border-radius:8px!important;padding:3px 8px!important;font-size:11px!important;font-weight:900!important}
.export-root{position:fixed;left:-100000px;top:0;width:794px;background:#fff;color:#111;z-index:-1}
.export-root .paper{width:794px!important;min-width:794px!important;max-width:none!important;transform:none!important;background:#fff!important}
.export-root .photo-col{overflow:hidden!important;vertical-align:middle!important}
.export-root .photo-box{width:100%!important;max-width:100%!important;overflow:hidden!important;text-align:center!important;padding:4px!important}
.export-root .photo-grid{display:flex!important;flex-direction:column!important;gap:8px!important;align-items:center!important;width:100%!important;max-width:100%!important;overflow:hidden!important}
.export-root .photo-grid>div{width:100%!important;overflow:hidden!important;text-align:center!important}
.export-root .photo-box img,.export-root img{width:auto!important;max-width:150px!important;height:auto!important;max-height:190px!important;object-fit:contain!important;display:block!important;margin:2px auto!important;border:1px solid #e5e7eb!important;background:#fff!important}
.export-root .photo-tools,.export-root .add-photo,.export-root button,.export-root input[type=file]{display:none!important}
.export-result-text{display:inline-block;width:100%;text-align:center;font-weight:900}


/* ===== 文件大小控制版：图片清晰够用，整体体积可控 ===== */
.photo-box img{
  width:auto!important;
  max-width:135px!important;
  height:auto!important;
  max-height:165px!important;
  object-fit:contain!important;
}
.export-root .photo-box img,
.export-root img{
  width:auto!important;
  max-width:135px!important;
  height:auto!important;
  max-height:165px!important;
  object-fit:contain!important;
}


/* ===== 照片格式修正版：清楚但不乱版 ===== */
.photo-col{overflow:hidden!important;vertical-align:middle!important}
.photo-box{width:100%!important;max-width:100%!important;overflow:hidden!important;display:block!important;text-align:center!important;padding:4px!important}
.photo-grid{display:flex!important;flex-direction:column!important;gap:8px!important;align-items:center!important;justify-content:flex-start!important;width:100%!important;max-width:100%!important;overflow:hidden!important}
.photo-grid>div{width:145px!important;max-width:145px!important;min-height:185px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;text-align:center!important;margin:0 auto!important}
.photo-box img{width:145px!important;height:185px!important;max-width:145px!important;max-height:185px!important;object-fit:contain!important;display:block!important;margin:0 auto!important;border:1px solid #e5e7eb!important;background:#fff!important}
.photo-tools{display:flex!important;justify-content:center!important;gap:6px!important;margin:4px 0 0!important}
.photo-tools button,button[data-del-photo]{display:inline-block!important;background:#fee2e2!important;color:#991b1b!important;border:0!important;border-radius:8px!important;padding:3px 8px!important;font-size:11px!important;font-weight:900!important}
.export-root .photo-col{overflow:hidden!important;vertical-align:middle!important}
.export-root .photo-box{width:100%!important;max-width:100%!important;overflow:hidden!important;text-align:center!important;padding:4px!important}
.export-root .photo-grid{display:flex!important;flex-direction:column!important;gap:8px!important;align-items:center!important;justify-content:flex-start!important;width:100%!important;max-width:100%!important;overflow:hidden!important}
.export-root .photo-grid>div{width:145px!important;max-width:145px!important;min-height:185px!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;text-align:center!important;margin:0 auto!important}
.export-root .photo-box img,.export-root img{width:145px!important;height:185px!important;max-width:145px!important;max-height:185px!important;object-fit:contain!important;display:block!important;margin:0 auto!important;border:1px solid #e5e7eb!important;background:#fff!important}
.export-root .photo-tools,.export-root .add-photo,.export-root button,.export-root input[type=file]{display:none!important}

</style>
</head>

<div class="app">
  <aside class="panel">
    <h1>质保验收报告</h1>
    <div class="hint">照片格式修正版：照片清楚且固定在记录方式栏内，不再拉伸变形；Word可编辑，PDF可直出。</div>
    <div class="btns">
      <button id="exportWordBtn" type="button" onclick="exportWordEditable()">导出 Word</button>
      <button id="exportPdfBtn" type="button" class="green" onclick="exportPDF()">导出 PDF</button>

      <button id="loadBtn" type="button" class="secondary" onclick="document.getElementById('loadFile').click()">读取数据</button>
      <input id="loadFile" class="file-input" type="file" accept=".json,application/json">
    </div>
    <div id="status" class="status"></div>

    <label>报告标题</label>
    <input id="reportTitle" value="理想汽车超充站质保验收报告">

    <label>场站名称</label>
    <input id="stationName" value="理想超充站 杭州浙大网新">

    <label>验收人员</label>
    <input id="inspector" value="">

    <label>验收日期</label>
    <input id="acceptDate" type="date" value="2026-05-16">

    <div class="usage">
      <b>使用说明：</b><br>
      1. 表格内容可在右侧直接点击编辑。<br>
      2. 记录方式列点击“添加照片”。<br>
      3. 检查结果可选：合格 / 不合格 / 不涉及。<br>
      4. 导出 PDF 为直出文件，不需要手动打印。<br>
      5. Word为真实可编辑表格；照片固定规格显示，避免版式异常。
    </div>
  </aside>

  <main class="preview-wrap">
    <div id="paperScaleBox">
      <div id="paper" class="paper"></div>
    </div>
  </main>
</div>

}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,"<br>")}

function cellClass(ti,ri,cell){
  let cls=cell.classes||"";
  if(ti===0&&ri===3) cls+=" header-cell";
  if((cls.includes("remark-col")||cell.col===5)&&!(ti===0&&ri===3)) cls+=" remark-col";
  return cls;
}
function isResultCell(ti,ri,cell){return (cell.classes||"").includes("result-col")&&!(ti===0&&ri===3)}
function renderResult(cell){
  const v=cell.text||"合格";
  cell.text=v;
  return '<select class="result-select" data-result-cell="'+cell.id+'">'+
    '<option '+(v==="合格"?"selected":"")+'>合格</option>'+
    '<option '+(v==="不合格"?"selected":"")+'>不合格</option>'+
    '<option '+(v==="不涉及"?"selected":"")+'>不涉及</option>'+
  '</select>';
}
function renderPhoto(cell){
  const photos=cell.photos||[];
  let html='<div class="photo-box" data-photo-cell="'+cell.id+'">';
  if(photos.length) {
    html+='<div class="photo-grid">';
    photos.slice(0,8).forEach((p,i)=>{
      html+='<div><img src="'+p.src+'"><div class="photo-tools"><button type="button" class="danger" data-del-photo="'+cell.id+'" data-index="'+i+'">删除</button></div></div>';
    });
    html+='</div>';
    if(photos.length>8) html+='<div style="font-size:11px;color:#64748b">另有'+(photos.length-8)+'张照片</div>';
  }
  html+='<button type="button" class="add-photo" data-add-photo="'+cell.id+'">添加照片</button>';
  html+='<input class="file-input" type="file" accept="image/*" multiple data-file-input="'+cell.id+'">';
  html+='</div>';
  return html;
}
function render(){
  syncHeader();
  const paper=document.getElementById("paper");
  let out="";
  for(let ti=0;ti<tables.length;ti++){
    const tbl=tables[ti];
    out+='<table class="template-table" data-table="'+ti+'"><tbody>';
    for(let ri=0;ri<tbl.rows.length;ri++){
      const row=tbl.rows[ri].slice().sort((a,b)=>(a.col||0)-(b.col||0));
      out+="<tr>";
      row.forEach(cell=>{
        const attrs=(cell.colspan>1?' colspan="'+cell.colspan+'"':'')+(cell.rowspan>1?' rowspan="'+cell.rowspan+'"':'');
        const cls=cellClass(ti,ri,cell);
        const editable=(cell.isPhoto||isResultCell(ti,ri,cell)||(ti===0&&ri<=2))?'':' contenteditable="true"';
        let content="";
        if(cell.isPhoto) content=renderPhoto(cell);
        else if(isResultCell(ti,ri,cell)) content=renderResult(cell);
        else content=nl2br(cell.text);
        out+='<td class="'+cls+'" data-cell="'+cell.id+'"'+attrs+editable+'>'+content+'</td>';
      });
      out+="</tr>";
    }
    out+="</tbody></table>";
  }
  paper.innerHTML=out;
  setTimeout(fitMobile,80);
}
function fitMobile(){
  const paper=document.getElementById("paper");
  const box=document.getElementById("paperScaleBox");
  if(!paper||!box)return;
  if(window.innerWidth<=768){
    const scale=Math.min(1,(box.clientWidth||window.innerWidth)/794);
    paper.style.transform='scale('+scale+')';
    paper.style.width='794px';
    paper.style.minWidth='794px';
    box.style.height=Math.ceil(paper.scrollHeight*scale+20)+'px';
  }else{
    paper.style.transform='';
    paper.style.width='';
    paper.style.minWidth='';
    box.style.height='';
  }
}
function findCell(id){
  for(const tbl of tables) for(const row of tbl.rows) for(const cell of row) if(cell.id===id) return cell;
  return null;
}

async function readImageFile(file){
  // 文件大小控制版：上传时压缩到报告清晰可用尺寸，避免Word/PDF过大
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>resolve(e.target.result);r.onerror=reject;r.readAsDataURL(file);});
  return await compressDataUrl(raw,1280,0.78);
}
function loadImg(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;})}
async function compressDataUrl(dataUrl,maxSide=1280,quality=0.78){
  try{
    const img=await loadImg(dataUrl);
    const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*scale));
    const h=Math.max(1,Math.round(img.height*scale));
    const c=document.createElement("canvas");
    c.width=w;c.height=h;
    const ctx=c.getContext("2d",{alpha:false});
    ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    return c.toDataURL("image/jpeg",quality);
  }catch(e){return dataUrl}
}

document.getElementById("paper").addEventListener("input",e=>{

  if(!td||td.querySelector(".photo-box")||td.querySelector("select"))return;
  const cell=findCell(td.dataset.cell);
  if(cell) cell.text=td.innerText;
});
document.getElementById("paper").addEventListener("change",e=>{
  const sel=e.target.closest("select[data-result-cell]");
  if(sel){const cell=findCell(sel.dataset.resultCell);if(cell){cell.text=sel.value;render();}}
  const input=e.target.closest("input[data-file-input]");
  if(input){
    const cell=findCell(input.dataset.fileInput);
    if(!cell)return;
    const files=[...input.files].filter(f=>f.type.startsWith("image/"));
    (async()=>{
      cell.photos=cell.photos||[];
      for(let i=0;i<files.length;i++){setStatus("正在读取照片明细 "+(i+1)+"/"+files.length+"...");cell.photos.push({src:await readImageFile(files[i])});}
      input.value="";
      render();
      setStatus("照片明细上传完成",true);
      setTimeout(()=>setStatus("",false),1200);
    })();
  }
});
document.getElementById("paper").addEventListener("click",e=>{
  const add=e.target.closest("[data-add-photo]");
  if(add){const inp=document.querySelector('input[data-file-input="'+add.dataset.addPhoto+'"]');if(inp)inp.click();}

});

function dataUrlInfo(dataUrl){
  const m=String(dataUrl||"").match(/^data:(image\/(png|jpeg|jpg|webp));base64,(.*)$/i);
  if(!m) return null;
  let ext=(m[2]||"jpg").toLowerCase();
  if(ext==="jpeg") ext="jpg";
  return {mime:m[1], ext, base64:m[3]};
}

function collectOriginalPhotos(){
  const list=[];
  for(let ti=0;ti<tables.length;ti++){
    const tbl=tables[ti];
    for(let ri=0;ri<tbl.rows.length;ri++){
      const row=tbl.rows[ri];
      let no="", category="", content="";
      for(const c of row){
        const cls=c.classes||"";
        if(cls.includes("no-col")) no=c.text||"";
        if(cls.includes("cat-col")) category=c.text||"";
        if(cls.includes("content-col")) content=c.text||"";
      }
      for(const cell of row){
        if(cell.isPhoto && cell.photos && cell.photos.length){
          cell.photos.forEach((p,idx)=>list.push({no,category,content,index:idx+1,src:p.src}));
        }
      }
    }
  }
  return list;
}

    img.onerror=()=>resolve({w:1200,h:900});
    img.src=src;
  });
}

async function exportPDF(){
  if(typeof html2canvas==="undefined" || !window.jspdf){
    alert("PDF组件未加载成功，请刷新页面后重试。");
    return;
  }
  setStatus("正在生成PDF文件，请稍等...");
  const root=cloneForExportFinal();
  try{
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF("p","mm","a4");
    const pageW=210,pageH=297,margin=8,imgW=pageW-margin*2;
    let first=true;
    const tableEls=[...root.querySelectorAll("table")];
    for(let i=0;i<tableEls.length;i++){
      setStatus("正在生成PDF表格 "+(i+1)+"/"+tableEls.length+"...");
      const canvas=await html2canvas(tableEls[i],{backgroundColor:"#fff",scale:1.65,useCORS:true,allowTaint:true,scrollX:0,scrollY:0,logging:false,windowWidth:900});
      const imgH=imgW*canvas.height/canvas.width;
      if(imgH <= pageH-margin*2){
        if(!first)pdf.addPage(); first=false;
        pdf.addImage(canvas.toDataURL("image/jpeg",0.86),"JPEG",margin,margin,imgW,imgH);
      }else{
        const sliceH=Math.floor(canvas.width*(pageH-margin*2)/imgW);
        const partCanvas=document.createElement("canvas");
        const ctx=partCanvas.getContext("2d");
        partCanvas.width=canvas.width; partCanvas.height=sliceH;
        let y=0;
        while(y<canvas.height){
          if(!first)pdf.addPage(); first=false;
          ctx.fillStyle="#fff";ctx.fillRect(0,0,partCanvas.width,partCanvas.height);
          const h=Math.min(sliceH,canvas.height-y);
          ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
          pdf.addImage(partCanvas.toDataURL("image/jpeg",0.86),"JPEG",margin,margin,imgW,pageH-margin*2);
          y+=sliceH;
        }
      }
      canvas.width=1; canvas.height=1;
    }

    const originalPhotos=collectOriginalPhotos();
    for(let pi=0;pi<originalPhotos.length;pi++){
      const p=originalPhotos[pi];
      setStatus("正在写入PDF照片 "+(pi+1)+"/"+originalPhotos.length+"...");
      const size=await imageNaturalSize(p.src);
      const maxW=pageW-margin*2;
      const maxH=pageH-margin*2-28;
      let w=Math.min(maxW,170);
      let h=w*size.h/size.w;
      if(h>maxH){h=maxH;w=h*size.w/size.h;}
      pdf.addPage();
      pdf.setFontSize(11);
      pdf.text("照片明细 "+(pi+1)+"/"+originalPhotos.length+"  序号："+(p.no||"-")+"  类别："+(p.category||"-"), margin, margin+4);
      const fmt=(p.src.indexOf("image/png")>=0)?"PNG":"JPEG";
      pdf.addImage(p.src, fmt, (pageW-w)/2, margin+12, w, h);
    }

    pdf.save(getExportBaseName()+".pdf");
    setStatus("PDF已生成",true);
    setTimeout(()=>setStatus("",false),1800);
  }catch(e){
    console.error(e);
    alert("PDF导出失败：照片可能太多或文件过大，请用电脑浏览器导出。");
    setStatus("",false);
  }finally{
    cleanup(root);
  }
}

    const docRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.map(r=>'<Relationship Id="'+r.rId+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+r.fileName+'"/>').join("")+'</Relationships>';
    const contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Default Extension="webp" ContentType="image/webp"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';

/* ===== 可编辑Word导出：真实表格，不再整表截图 ===== */
function xmlEscapeText(s){
  return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;"}[m]));
}
function dataUrlInfoForDocx(dataUrl){
  const m=String(dataUrl||"").match(/^data:(image\/(png|jpeg|jpg|webp));base64,(.*)$/i);
  if(!m) return null;
  let ext=(m[2]||"jpg").toLowerCase();
  if(ext==="jpeg") ext="jpg";
  return {mime:m[1], ext, base64:m[3]};
}
function pXml(text, bold=false, align="left", size=22){
  const t=xmlEscapeText(text);
  const jc=align?'<w:jc w:val="'+align+'"/>':'';
  return '<w:p><w:pPr>'+jc+'</w:pPr><w:r><w:rPr>'+(bold?'<w:b/>':'')+'<w:sz w:val="'+size+'"/></w:rPr><w:t xml:space="preserve">'+t+'</w:t></w:r></w:p>';
}
function lineTextXml(text, bold=false, align="left", size=22){
  const parts=String(text||"").split(/\n/);
  return parts.map((x,i)=>pXml(x,bold,align,size)).join("");
}
function tcXml(inner, opts={}){
  const gridSpan=opts.colspan&&opts.colspan>1?'<w:gridSpan w:val="'+opts.colspan+'"/>':'';
  let vMerge='';
  if(opts.vMerge==="restart") vMerge='<w:vMerge w:val="restart"/>';
  if(opts.vMerge==="continue") vMerge='<w:vMerge/>';
  const valign='<w:vAlign w:val="'+(opts.valign||"center")+'"/>';
  const shade=opts.shade?'<w:shd w:fill="'+opts.shade+'"/>':'';
  const width=opts.width?'<w:tcW w:w="'+opts.width+'" w:type="dxa"/>':'';
  return '<w:tc><w:tcPr>'+width+gridSpan+vMerge+valign+shade+'</w:tcPr>'+inner+'</w:tc>';
}
function imgXml(rId, widthPx, heightPx){
  const cx=Math.round(widthPx*9525), cy=Math.round(heightPx*9525);
  return '<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="'+Math.floor(Math.random()*999999)+'" name="photo"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="0" name="photo"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="'+rId+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}
function pageBreakXml(){
  return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
}
function getCellTextForDocx(cell){
  if(!cell) return "";
  return String(cell.text||"");
}
async function imageSizeSafe(src){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve({w:img.naturalWidth||img.width||1200,h:img.naturalHeight||img.height||900});
    img.onerror=()=>resolve({w:1200,h:900});
    img.src=src;
  });
}
async function buildEditableDocxXml(media, rels){
  syncHeader();

  const colWidths=[700,1250,1700,1900,1200,1250]; // 6列，总约7900 dxa
  let bodyXml="";

  for(let ti=0;ti<tables.length;ti++){
    const tbl=tables[ti];
    bodyXml+='<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders><w:top w:val="single" w:sz="12" w:color="000000"/><w:left w:val="single" w:sz="12" w:color="000000"/><w:bottom w:val="single" w:sz="12" w:color="000000"/><w:right w:val="single" w:sz="12" w:color="000000"/><w:insideH w:val="single" w:sz="8" w:color="000000"/><w:insideV w:val="single" w:sz="8" w:color="000000"/></w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>'+colWidths.map(w=>'<w:gridCol w:w="'+w+'"/>').join("")+'</w:tblGrid>';

    const rowSpanMap={}; // col -> remaining count
    for(let ri=0;ri<tbl.rows.length;ri++){
      const row=tbl.rows[ri].slice().sort((a,b)=>(a.col||0)-(b.col||0));
      const byCol={};
      row.forEach(c=>{byCol[c.col||0]=c});
      bodyXml+='<w:tr>';
      let col=0;
      while(col<6){
        if(rowSpanMap[col] && !byCol[col]){
          bodyXml+=tcXml(pXml("",false,"center"),{vMerge:"continue",width:colWidths[col]});
          rowSpanMap[col]-=1;
          if(rowSpanMap[col]<=0) delete rowSpanMap[col];
          col++;
          continue;
        }
        const cell=byCol[col];
        if(!cell){
          bodyXml+=tcXml(pXml("",false,"center"),{width:colWidths[col]});
          col++;
          continue;
        }

        const cls=cell.classes||"";
        const colspan=cell.colspan||1;
        const rowspan=cell.rowspan||1;
        const width=colWidths.slice(col,col+colspan).reduce((a,b)=>a+b,0);
        let inner="";
        let align="left", bold=false;
        let size=22;
        if(cls.includes("title-cell")){align="center"; bold=true; size=28;}
        else if(cls.includes("header-cell") || (ti===0 && ri===3)){align="center"; bold=true; size=22;}
        else if(cls.includes("no-col") || cls.includes("cat-col") || cls.includes("result-col") || cls.includes("remark-col")){align="center"; bold=cls.includes("cat-col")||cls.includes("result-col");}

        if(cell.isPhoto){
          const photos=(cell.photos||[]).slice(0,8);
          if(photos.length===0){
            inner=pXml("添加照片",false,"center",20);
          }else{
            for(let pi=0;pi<photos.length;pi++){
              const info=dataUrlInfoForDocx(photos[pi].src);
              if(!info) continue;
              const rId="rIdPhoto_"+ti+"_"+ri+"_"+col+"_"+pi+"_"+Math.floor(Math.random()*100000);
              const fileName="photo_"+ti+"_"+ri+"_"+col+"_"+pi+"."+info.ext;
              media.file(fileName, info.base64, {base64:true});
              rels.push({rId:rId,fileName:fileName});
              const sizeObj=await imageSizeSafe(photos[pi].src);
              let targetW=145, targetH=185;
              inner+=imgXml(rId,targetW,targetH);
            }
            if((cell.photos||[]).length>8) inner+=pXml("另有"+((cell.photos||[]).length-8)+"张照片",false,"center",18);
          }
        }else if(cls.includes("result-col") && ri>3){
          inner=pXml(cell.text||"合格",true,"center",22);
        }else{
          inner=lineTextXml(getCellTextForDocx(cell),bold,align,size);
        }

        bodyXml+=tcXml(inner,{colspan:colspan,vMerge:rowspan>1?"restart":null,width:width,valign:"center"});
        if(rowspan>1){
          for(let k=0;k<colspan;k++) rowSpanMap[col+k]=rowspan-1;
        }
        col+=colspan;
      }
      bodyXml+='</w:tr>';
    }
    bodyXml+='</w:tbl><w:p/>';
  }

  return bodyXml;
}
